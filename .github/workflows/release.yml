name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - name: Build CLI binaries
        run: |
          mkdir dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/k8sgames-linux-amd64 ./cmd/k8sgames
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/k8sgames-linux-arm64 ./cmd/k8sgames
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/k8sgames-darwin-amd64 ./cmd/k8sgames
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/k8sgames-darwin-arm64 ./cmd/k8sgames
          cd dist && sha256sum k8sgames-* > checksums.txt
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/huypham37/k8sgames:${{ github.ref_name }}
            ghcr.io/huypham37/k8sgames:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.toolbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/huypham37/k8sgames-toolbox:${{ github.ref_name }}
            ghcr.io/huypham37/k8sgames-toolbox:latest
          cache-from: type=gha,scope=toolbox
          cache-to: type=gha,mode=max,scope=toolbox
      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: true
          files: dist/*
